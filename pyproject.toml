[project]
name = "semantic-afterlife"
version = "0.1.0"
description = "Long-run semantic dynamics of large language models beyond the context horizon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Semantic Afterlife project" }]
keywords = [
    "large-language-models",
    "dynamical-systems",
    "markov-state-models",
    "semantic-drift",
    "context-window",
    "attractors",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # --- API access ---------------------------------------------------------
    "httpx>=0.27",
    "tenacity>=9.0",
    # --- configuration ------------------------------------------------------
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # --- CLI / console ------------------------------------------------------
    "typer>=0.12",
    "rich>=13.7",
    # --- tokenization (tokenizer files only; no torch, no GPU) --------------
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    # --- numerics -----------------------------------------------------------
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # --- visualisation ------------------------------------------------------
    "plotly>=5.24",
    "kaleido>=0.2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # --- serialisation / reporting -----------------------------------------
    "orjson>=3.10",
    "jinja2>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Installed from Stage 3 onwards (dynamics estimation). Kept separate so that
# Stage 0/1 environments stay small and fast to build.
dynamics = [
    "deeptime>=0.4.4",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
]
# Local CPU/GPU generation for the base-model existence check (ADR-0011).
# Prefer the CPU torch wheel on machines without NVIDIA:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
#   uv pip install 'transformers>=4.51' accelerate
local = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=1.0",
]

[project.scripts]
afterlife = "semantic_afterlife.cli:app"

[project.urls]
Repository = "https://github.com/AdamCage/llm-semantic-afterlife"
Issues = "https://github.com/AdamCage/llm-semantic-afterlife/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_afterlife"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "NPY",           # numpy legacy
    "PD",            # pandas-vet
    "ARG",           # unused arguments
    "PTH",           # prefer pathlib
]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",    # typer relies on function-call defaults
    # Mathematical notation is deliberate throughout: figure labels, docstrings and
    # captions use the same symbols as the manuscript (alpha, tau, minus sign, en
    # dash). Consistency between code and paper is worth more than ASCII purity.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
# Deliberately not pinning `python_version`: mypy then targets whichever
# interpreter it runs under. Pinning 3.11 while running on 3.12 makes mypy
# reject 3.12-only syntax inside third-party stubs (numpy's `type` statements),
# which fails the CI matrix for a reason unrelated to our code.
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "network: test performs real API calls and costs money (deselected by default)",
    "slow: test takes more than ~5 seconds",
]
filterwarnings = ["error::DeprecationWarning:semantic_afterlife.*"]
asyncio_mode = "auto"
