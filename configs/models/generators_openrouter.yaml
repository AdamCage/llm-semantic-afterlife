# ===========================================================================
# Generator library — OpenRouter
# ---------------------------------------------------------------------------
# Same model families as `generators.yaml`, reached through the second provider.
# Kept in a separate file rather than as a flag on the RouterAI definitions,
# because a generator is defined by (model, provider, endpoint, quantization) and
# collapsing two of those into one entry is how endpoints silently diverge
# between stages (ADR-0003).
#
# Two uses:
#   1. Stage 6 cross-provider replication of headline results.
#   2. Provider selection for Stage 1, since catalogue prices are markedly lower
#      here (mistral-nemo $0.019/$0.030 against $0.061/$0.223 on RouterAI) --
#      but price is not the binding constraint under protocol P1, sustained
#      throughput is (S0 finding F5), so the choice is settled by measurement.
#
# `provider_slug` is null until the endpoint audit runs against this provider.
# Prices are catalogue-level; per-endpoint prices come from the audit.
# ===========================================================================

generator_library:
  or-mistral-nemo-12b:
    model_id: mistralai/mistral-nemo
    api: openrouter
    tokenizer_repo: mistralai/Mistral-Nemo-Instruct-2407
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # PINNED (S0.11): Io Net, fp16. OpenRouter slugs carry the quantization
    # explicitly (`io-net/fp16`), pinning precision as well as provider --
    # strictly better provenance than RouterAI's bare tag.
    #
    # Not the cheapest. `parasail/fp8` is $0.030 both ways against $0.044/$0.160
    # here, and was tried first: it sustained 12 consecutive steps before an
    # upstream 429 that ten exponential retries (~8 minutes) did not clear. The
    # same provider throttled after ~4 steps through RouterAI, so the limit
    # follows the upstream pool rather than the router. Io Net is the endpoint
    # that completed the equivalent trajectory on RouterAI, and it is still ~28%
    # cheaper here than there ($0.061/$0.223).
    provider_slug: io-net/fp16
    allow_fallbacks: false
    native_context: 128000
    price_usd_per_m_input: 0.044
    price_usd_per_m_output: 0.160
    expected_block_fill: 0.88
    extra_body:
      reasoning_effort: none
    notes: >-
      Catalogue price is ~3x cheaper on input and ~7x on output than the pinned
      RouterAI endpoint. Whether that survives contact with sustained load is the
      question the audit answers.

  or-qwen3-8b:
    model_id: qwen/qwen3-8b
    api: openrouter
    tokenizer_repo: Qwen/Qwen3-8B
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # PINNED (S0.10): Alibaba, the only endpoint here as on RouterAI.
    # Quantization `unknown` on both, which is a limitation to state rather than
    # one we can design away.
    provider_slug: alibaba
    allow_fallbacks: false
    native_context: 131072
    price_usd_per_m_input: 0.117
    price_usd_per_m_output: 0.455
    extra_body:
      reasoning_effort: none
    notes: >-
      MEASURED (S0.12): reasons by default (653 tokens for a 96-token request,
      a 7.8x overshoot). `reasoning_effort: none` suppresses it on BOTH
      providers, which is why that switch is used everywhere. Confirms the
      RouterAI trap independently: `include_reasoning: false` is accepted here
      too and still leaves 575 reasoning tokens, hiding the trace rather than
      preventing it (ADR-0005).

  or-muse-glimmer-30b:
    model_id: meta/muse-glimmer-30b
    api: openrouter
    tokenizer_repo: meta-models/Muse-Glimmer-30B
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # PINNED (S0.10): Parasail, bf16 -- a known quantization (Phala, Together and
    # Fireworks all report `unknown`), status 0, and a 117964-token completion
    # cap. DeepInfra is also bf16 but caps completions at 16384 and prices output
    # higher.
    provider_slug: parasail/bf16
    allow_fallbacks: false
    native_context: 131072
    price_usd_per_m_input: 0.30
    price_usd_per_m_output: 1.10
    extra_body: {}
    max_reasoning_tokens: 0
    expected_block_fill: 1.0
    notes: >-
      Reasons on chat but not on raw completion (S0.3), so the mechanism is not
      a preference here. A `:batch` variant exists at a higher unit price; not
      used, since batching would break the sequential dependency of a trajectory.
      RE-ADMITTED for Stage 2. It was dropped after the convergence probe, where
      three of four cells died on five consecutive empty completions at W=4096
      and `HANDOFF.md` recorded that as a property of the window. Probed again
      at a genuine 4096-token window (S2.0): two calls, both `finish_reason=
      length` with a full 1024-token block and zero reasoning. So the empty
      completions are intermittent rather than a property of W, and the earlier
      note generalised from four cells. Whether the intermittency is frequent
      enough to make trajectories unviable is what S2.1 measures; the
      empty-completion guard fails the trajectory loudly either way, so the rate
      is observable rather than silent.

  # -- Stage 2 model-diversity axis ----------------------------------------
  # Stage 1 could not assess E2: every number rested on qwen3-8b, because
  # glimmer cannot free-run at W=4096 and llama/mistral lost every cell to 429.
  # These three restore generator diversity along two axes that matter:
  # sparse Mixture-of-Experts against dense, and a 15x parameter range.
  #
  # All three are instruction-tuned, so they address "is convergence specific to
  # one model" and NOT "is convergence specific to instruction tuning" -- that
  # second question needs the local base model of ADR-0008 S2.2 and is not
  # answered here.
  #
  # Endpoints pinned by tag, which on OpenRouter carries the quantization, so
  # provider AND numerical precision are both fixed. Endpoints reporting
  # `unknown` quantization are avoided where a declared alternative exists at a
  # comparable price -- qwen3-8b's `unknown` is a provenance hole this stage
  # does not need to repeat.

  or-gpt-oss-120b:
    model_id: openai/gpt-oss-120b
    api: openrouter
    tokenizer_repo: openai/gpt-oss-120b
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # akashml/bf16: cheapest endpoint with a *declared* precision, status 0, and
    # a 117964-token completion cap. coreweave/fp4 matches the price with more
    # throughput but at fp4; bf16 is preferred because this model is the noisier
    # of the two arms already (MoE routing) and adding quantization error to
    # routing noise makes a negative result uninterpretable.
    provider_slug: akashml/bf16
    allow_fallbacks: false
    native_context: 131072
    price_usd_per_m_input: 0.03
    price_usd_per_m_output: 0.17
    # Reasoning is ALLOWED and bounded, not disabled: every one of the 20
    # endpoints refuses `reasoning.enabled=false` with an explicit
    # "Reasoning is mandatory for this endpoint and cannot be disabled" (S2.0).
    # See ADR-0009 for why a bounded budget is admissible where a hidden one is
    # not.
    extra_body:
      reasoning:
        effort: low
        exclude: false
    max_reasoning_tokens: 64
    expected_block_fill: 1.0
    notes: >-
      117B MoE, 5.1B active. MEASURED at the real regime (S2.0, 4096-token
      window of genuine trajectory prose, max_tokens=1024): reasoning 33-43
      tokens, i.e. 3-4% of the block, and `finish_reason=length` on every call --
      it fills the block, which qwen3-8b stopped doing by its final quarter.
      The tolerance of 64 is roughly 1.5x the observed maximum, and the guard
      still fails the step above it.
      A short-prompt probe first showed only 8-9 reasoning tokens; the real
      window shows 4x that, so the tolerance is set from the window measurement
      and not from the cheap one.
      PROVENANCE GAP: `/completions` reports `reasoning_tokens` but does not
      return the trace text, while `/chat/completions` does. We therefore know
      how many hidden tokens each step contained but not what they said. Bounded
      and recorded, but it must be stated.
      EXPECT NON-DETERMINISM: deepseek-v4-flash, the only MoE audited in Stage 0,
      held 20% exact-match reproducibility even pinned to one endpoint,
      plausibly batch-dependent expert routing. Claims are distributional;
      `audit determinism` measures the rate rather than assuming it.

  or-gpt-oss-20b:
    model_id: openai/gpt-oss-20b
    api: openrouter
    tokenizer_repo: openai/gpt-oss-20b
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # deepinfra/bf16: the cheapest declared-bf16 endpoint, status 0, ample
    # completion cap. Same family as the 120b at a sixth of the active
    # parameters, so the pair isolates scale within one architecture and one
    # post-training recipe.
    provider_slug: deepinfra/bf16
    allow_fallbacks: false
    native_context: 131072
    price_usd_per_m_input: 0.03
    price_usd_per_m_output: 0.14
    # Same refusal as the 120b: reasoning cannot be switched off on any of the
    # 13 endpoints, so it is bounded instead (ADR-0009).
    extra_body:
      reasoning:
        effort: low
        exclude: false
    max_reasoning_tokens: 32
    expected_block_fill: 0.72
    notes: >-
      21B MoE, 3.6B active, Apache 2.0. Paired with gpt-oss-120b deliberately:
      same family and response format, six times the active parameters apart, so
      a difference between them is about scale rather than about training data.
      MEASURED at the real regime (S2.0): reasoning tokens 0 on every call, even
      though the endpoint refuses to disable reasoning -- at `effort: low` on a
      continuation task it simply does not think. The tolerance of 32 is there
      because "did not think this time" is not "cannot think".
      Block fill is the concern here rather than reasoning: two calls gave 1024
      and 454 tokens (`length` then `stop`), so it stops early some of the time.
      0.72 is the midpoint of that pair and is a placeholder to be replaced by
      the S2.1 measurement, not a result.

  or-gemma-4-31b:
    model_id: google/gemma-4-31b-it
    api: openrouter
    tokenizer_repo: google/gemma-4-31b-it
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # venice/bf16: MEASURED usable (S2.0), declared bf16, status 0, reasoning
    # tokens 0. Its 8192-token completion cap is ample for B=1024.
    # novita/bf16 was pinned first on catalogue data and rejected the request
    # body outright (400 INVALID_REQUEST_BODY) -- catalogue metadata does not
    # predict whether an endpoint serves this protocol, which is why the
    # capability probe runs before the plan is written.
    provider_slug: venice/bf16
    allow_fallbacks: false
    native_context: 256000
    price_usd_per_m_input: 0.12
    price_usd_per_m_output: 0.36
    extra_body:
      reasoning:
        enabled: false
    max_reasoning_tokens: 0
    expected_block_fill: 0.68
    notes: >-
      30.7B DENSE, released 2026-04. The control against the two MoE arms: if
      convergence appears in a dense model with high seed-reproducibility as
      well as under noisy MoE routing, "the fixed point is a determinism
      artifact" is closed as an explanation.
      MEASURED at the real regime (S2.0): reasoning 0 and the switch is
      accepted, so the zero tolerance stands. But it stops early -- 803 and 598
      tokens against a 1024 block, `finish_reason=stop` both times. That is the
      qwen3-8b failure mode, and 0.68 is the midpoint of the observed pair, to
      be replaced by the S2.1 measurement.
      Tokenizer is gated on the Hub and needs HF_TOKEN; verified loading and
      round-tripping 2026-09-01.

  or-deepseek-v4-flash:
    model_id: deepseek/deepseek-v4-flash
    api: openrouter
    tokenizer_repo: deepseek-ai/DeepSeek-V3
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    provider_slug: null
    allow_fallbacks: false
    native_context: 1048576
    price_usd_per_m_input: 0.080640
    price_usd_per_m_output: 0.161280
    extra_body:
      reasoning:
        enabled: false
    notes: >-
      Reasons intermittently (S0.3b), so the per-step guard matters more here
      than anywhere else. Dated and `-latest` variants exist; the undated,
      pinned-quantization endpoint is used so a run names one fixed generator.

  # Same model on a known-quantization endpoint, for the provenance-versus-speed
  # comparison. Groq is fast but reports `unknown` quantization and adds 35
  # tokens of server-side scaffolding to a raw completion; DeepInfra is fp8 and
  # less than half the price. Which wins depends on its throughput.
  or-llama31-8b-deepinfra:
    model_id: meta-llama/llama-3.1-8b-instruct
    api: openrouter
    tokenizer_repo: NousResearch/Meta-Llama-3.1-8B
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    provider_slug: deepinfra/fp8
    allow_fallbacks: false
    native_context: 131072
    price_usd_per_m_input: 0.020
    price_usd_per_m_output: 0.040
    extra_body:
      reasoning_effort: none
    notes: >-
      fp8, status 0, but `max_completion_tokens` is 16384 -- ample for B=1024.
      Cheapest llama endpoint on either provider.

  # A fifth family, available here and worth auditing while we are looking:
  # a third architecture would strengthen the model-specificity claim in H1.
  or-llama31-8b-instruct:
    model_id: meta-llama/llama-3.1-8b-instruct
    api: openrouter
    tokenizer_repo: NousResearch/Meta-Llama-3.1-8B
    continuation: raw_completion
    continuation_instruction: >-
      Continue the following text directly. Do not comment, summarise, explain
      or address the reader. Output only the continuation.
    is_base_model: false
    # PINNED (S0.11): Groq. Deliberately not the cheapest -- deepinfra/fp8 and
    # novita/fp8 are $0.020 against Groq's $0.050 -- but under protocol P1 the
    # binding constraint is sustained throughput, and both cheaper endpoints cap
    # completions at 16384/14745 tokens with shared pools that throttled every
    # other model we tried. Groq offers 131072 context and 117964 max completion.
    provider_slug: groq
    allow_fallbacks: false
    native_context: 131072
    price_usd_per_m_input: 0.05
    price_usd_per_m_output: 0.08
    extra_body:
      reasoning_effort: none
    notes: >-
      Not in the original plan. The Llama family was to enter as a base model,
      which does not exist on any provider (ADR-0006); this is the instruct
      variant and would restore a third architecture to the comparison cheaply.
      Quantization is reported as `unknown` for this endpoint, which is a
      provenance cost to weigh against its throughput.
