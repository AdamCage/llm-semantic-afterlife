# ===========================================================================
# Paper B local generator library (ADR-0023, ADR-0024)
# ---------------------------------------------------------------------------
# Ten NF4 checkpoints + two Qwen INT8 twins. `api: local`. Official BF16
# (or BF16-equivalent) Hub weights; one bitsandbytes recipe.
#
# extra_body knobs are the loading contract. Wave 1 must add them to
# `_LOAD_KEYS` before any live smoke. Until then they must not be passed
# to `model.generate`.
#
# Hub `revision` / `tokenizer_revision` pinned from Wave 0 CENSUS.md
# (main SHAs on 2026-09-09). Do not invent replacements.
#
# One checkpoint = one generate run on a GPU (ADR-0024). Listing several
# slugs in one stage YAML is for `afterlife plan` expansion, not a licence
# to interleave two models in VRAM.
#
# P2 is parked. Do not set protocol: P2_sliding_attention on these slugs.
# enable_thinking is Qwen-only so it cannot leak into other families'
# generate() kwargs.
# ===========================================================================

generator_library:
  # -- Qwen3-8B: causal anchor / post-training (S9) -----------------------
  pb-qwen3-8b-base:
    model_id: Qwen/Qwen3-8B-Base
    api: local
    tokenizer_repo: Qwen/Qwen3-8B-Base
    tokenizer_revision: 49e3418fbbbca6ecbdf9608b4d22e5a407081db4
    continuation: raw_completion
    is_base_model: true
    provider_slug: local
    allow_fallbacks: false
    price_usd_per_m_input: 0.0
    price_usd_per_m_output: 0.0
    extra_body: &nf4_qwen
      load_in_4bit: true
      bnb_4bit_quant_type: nf4
      bnb_4bit_use_double_quant: true
      bnb_4bit_compute_dtype: bfloat16
      dtype: bfloat16
      device_map: cuda
      attn_implementation: sdpa
      serialization: raw_bytes
      text_only: true
      enable_thinking: false
      revision: 49e3418fbbbca6ecbdf9608b4d22e5a407081db4
    notes: >-
      Paper B Qwen Base, NF4. Thinking off even on Base so a leaked
      chat template cannot start a think block. raw_bytes primary.
      Apache; ungated. Wave 0 pins revision.

