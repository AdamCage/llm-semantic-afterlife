# ===========================================================================
# Semantic seed bank v1
# ---------------------------------------------------------------------------
# Initial conditions X_0. Design constraints:
#
# 1. Every seed is *continuation-shaped*: declarative prose mid-flow, never a
#    question or an instruction. A base model must be able to continue it
#    without being asked to, since asking is external forcing.
# 2. Domains are maximally far apart, so that a probe distinguishing them past
#    the horizon is measuring semantic content rather than register.
# 3. Comparable length (~90-140 tokens), so the context horizon
#    t_h = W - L_0 does not vary much between trajectories.
# 4. No self-reference to models, AI, prompts or generation. Such text invites
#    meta-commentary, which is a distinct dynamical attractor and would
#    contaminate the seed contrast.
# 5. Twin pairs differ in exactly one factual proposition, for the
#    sensitivity-to-initial-conditions experiment (S5).
# ===========================================================================

version: v1
description: >-
  Ten maximally distant semantic domains plus two minimal-perturbation twin
  pairs. Used from Stage 0 onwards; extended, never edited in place, so that
  earlier runs remain interpretable.

