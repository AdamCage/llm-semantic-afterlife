# ===========================================================================
# S0.7 — end-to-end micro-trajectory
# ---------------------------------------------------------------------------
# Deliberately tiny. This validates the PIPELINE, not a hypothesis: generation,
# window arithmetic, chunking, embedding, geometry, figures, report, replay.
#
# Eight window turnovers is far too few for any scientific claim about long-run
# behaviour, and the Stage 0 report says so explicitly.
#
# Run offline first (costs nothing, catches most bugs):
#     $env:AFTERLIFE_EXECUTION_MODE="mock"
#     afterlife generate --config configs/stages/stage0_smoke.yaml
# ===========================================================================

include:
  - configs/models/generators.yaml
  - configs/embeddings/embeddings.yaml

stage: s0
name: smoke
description: >-
  End-to-end micro-trajectory validating the whole pipeline at negligible cost.

generators: [mock-hmm]
embeddings: [mock-hash]

windows:
  - W: 2048
    block_size: 512
    target_tokens: 16384      # 8 turnovers
    chunk_size: 512
    protocol: P1_reprompt

sampling:
  - temperature: 0.7
    top_p: 1.0

semantic_seeds: [physics, love]
stochastic_seeds: [1]

max_concurrent: 2
budget_usd: 0.5
