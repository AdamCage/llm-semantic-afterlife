# ===========================================================================
# S4.2 — first look at W = 8192 on or-qwen3-8b
# ---------------------------------------------------------------------------
# No existing 12-turnover W=8192 qwen arm. Stage 1 core moved to W=4096
# (viability sweep). All four temperatures are new generation (ADR-0014).
# ===========================================================================

include:
  - configs/models/generators_openrouter.yaml
  - configs/embeddings/embeddings.yaml

stage: s4
name: w8192
description: >-
  W=8192, 12 turnovers, or-qwen3-8b raw completion, T ∈ {0.3, 0.7, 1.0, 1.5}.
  Matched turnover count to S2 / S4.1 so a W-effect is not a T/W mix.

generators:
  - or-qwen3-8b

embeddings: [bge-m3, qwen3-embed-8b]

windows:
  - W: 8192
    block_size: 1024
    target_tokens: 98304 # 12 turnovers
    chunk_size: 1024
    protocol: P1_reprompt

sampling:
  - temperature: 0.3
    top_p: 1.0
  - temperature: 0.7
    top_p: 1.0
  - temperature: 1.0
    top_p: 1.0
  - temperature: 1.5
    top_p: 1.0

semantic_seeds: [physics, surreal]
stochastic_seeds: [1, 2]

max_concurrent: 2
# afterlife estimate 2026-09-03: $2.12 at fill=1. S2.2 raw fill ~0.65
# raises that to ~$2.88. $10 is the refuse, not a spend target.
budget_usd: 10.0
