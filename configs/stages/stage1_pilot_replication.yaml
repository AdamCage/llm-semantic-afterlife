# ===========================================================================
# S1 replication arm — is the effect architecture-specific?
# ---------------------------------------------------------------------------
# muse-glimmer-30b at W = 4096, the other generator that survived the viability
# sweep. Measured at this window:
#
#   block fill 1.000, stop rate 0.00  -> the stride is exactly S = B here
#   repetition 0.9x natural prose     -> cleaner than the human reference corpus
#   prompt-token delta 1              -> essentially no server-side scaffolding
#   bf16, a known quantization        -> against `unknown` for the core arm
#
# It is architecturally different in kind from qwen -- interleaved local/global
# attention with a 2048-token local span against a dense decoder -- which is what
# H1's model-specificity claim needs. Two decoder variants would not do.
#
# W = 4096 is not incidental for this model: it is exactly twice its local
# attention window, and it is where glimmer is perfect. At 2048 it returns
# empties and at 8192 it fails outright with a bare EOS at a full window. That
# pattern is a hypothesis for Stage 4 to test on a finer W grid, not a finding.
#
# Narrower than the core arm because it costs ~2.5x per token ($0.30/$1.10
# against $0.117/$0.455). What is kept and what is given up:
#   KEPT:  W and T identical to the core arm, so the arms are comparable
#   KEPT:  all 8 semantic seeds -- the pilot's primary measurement needs them
#   KEPT:  2 stochastic seeds, the minimum permitting a variance estimate
#   GIVEN UP: the temperature contrast; mapping temperature is Stage 4's job
#
# Forecast ~$4.8 for 16 trajectories, ~40 min each.
# ===========================================================================

include:
  - configs/models/generators_openrouter.yaml
  - configs/embeddings/embeddings.yaml

stage: s1
name: pilot-replication
description: >-
  Is the phenomenon architecture-specific? A hybrid local/global attention model
  at the same window and trajectory length as the core arm, at one temperature.

generators: [or-muse-glimmer-30b]
embeddings: [bge-m3, qwen3-embed-8b]

windows:
  - W: 4096
    block_size: 1024
    target_tokens: 131072 # 32 turnovers
    chunk_size: 1024
    protocol: P1_reprompt

sampling:
  - temperature: 1.0
    top_p: 1.0

semantic_seeds:
  [physics, finance, biology, war, love, programming, surreal, noise]

stochastic_seeds: [1, 2]

max_concurrent: 2
budget_usd: 7.0
