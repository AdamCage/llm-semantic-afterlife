# ===========================================================================
# S1 replication arm — is the effect architecture-specific?
# ---------------------------------------------------------------------------
# A second family at the same window and trajectory length as the core arm.
# qwen3-8b costs ~6x llama per token ($0.117/$0.455 against $0.020/$0.040) and
# has exactly one endpoint on either provider, so the matrix is narrowed rather
# than the trajectory shortened.
#
# What is kept and what is given up, so the stage report can be explicit about
# the power lost:
#   KEPT:  W = 8192, T = 262144 (32 turnovers). Below ~16 turnovers no long-run
#          claim is supportable (risks.md R10), so this is not negotiable.
#   KEPT:  all 8 semantic seeds -- the primary pilot measurement is whether seed
#          identity survives the horizon, which needs class diversity.
#   KEPT:  2 stochastic seeds, the minimum permitting any variance estimate.
#   GIVEN UP: the temperature contrast. Only T = 1.0 runs here; mapping
#          temperature is Stage 4's job, and the pilot only needs to know whether
#          the effect appears in a second architecture at all.
#
# Reasoning (S0.12, measured on both providers): this model reasons by default --
# 653 tokens for a 96-token request, a 7.8x block overshoot. `reasoning_effort:
# none` is the only switch that suppresses generation on both providers;
# `include_reasoning: false` is accepted and still leaves 575 reasoning tokens.
# The per-step guard asserts zero regardless of what the switch claims
# (ADR-0005).
#
# Expect a *variable* stride here, unlike the core arm: block fill has not been
# measured at 1.000 for this endpoint, so the realised distribution must be
# reported rather than assumed.
# ===========================================================================

include:
  - configs/models/generators_openrouter.yaml
  - configs/embeddings/embeddings.yaml

stage: s1
name: pilot-replication
description: >-
  Is the phenomenon architecture-specific? A second model family at the same
  window and trajectory length as the core arm, at a single temperature.

generators: [or-qwen3-8b]
embeddings: [bge-m3, qwen3-embed-8b]

windows:
  - W: 8192
    block_size: 1024
    target_tokens: 262144 # 32 turnovers
    chunk_size: 1024
    protocol: P1_reprompt

sampling:
  - temperature: 1.0
    top_p: 1.0

semantic_seeds:
  [physics, finance, biology, war, love, programming, surreal, noise]

stochastic_seeds: [1, 2]

# Single endpoint with an 8192-token completion cap; ample for B=1024, but a
# single endpoint means no fallback if it throttles.
max_concurrent: 2
budget_usd: 8.0
