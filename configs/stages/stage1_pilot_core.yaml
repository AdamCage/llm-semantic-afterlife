# ===========================================================================
# S1 core arm — the wide matrix
# ---------------------------------------------------------------------------
# Generator and window chosen by measurement (docs/stages/stage-1/
# VIABILITY-SWEEP.md), after two earlier candidates were disqualified on output
# quality rather than on price or speed.
#
# qwen3-8b at W = 4096, measured:
#   block fill 0.942                  -> near-constant stride
#   repetition 1.7x natural prose     -> not degenerate
#   type-token 0.475, entropy 7.53    -> above the human reference
#   stable across W in {2048,4096,8192}, completed every cell
#
# Two families were dropped for producing degenerate text: mistral-nemo at
# 2.5-7.2x natural repetition with block fill never above 0.20, and
# llama-3.1-8b at 4.4-9.5x. Both were cheaper and one was 21x faster; neither
# writes text worth analysing.
#
# W = 4096 rather than 8192: it is the only window where both viable generators
# are at their best, and it costs a quarter as much per turnover. 32 turnovers
# are preserved by halving T with it (ADR-0004: turnovers, not absolute tokens,
# are what make a long-run claim defensible).
#
# Forecast ~$6.0 for 48 trajectories, ~43 min each (~17 h at concurrency 2).
# Runs are resumable; re-invoking continues from the last completed step.
# ===========================================================================

include:
  - configs/models/generators_openrouter.yaml
  - configs/embeddings/embeddings.yaml

stage: s1
name: pilot-core
description: >-
  Does the phenomenon exist? Wide arm on the generator measured to sustain
  free-running generation with human-like text: 32 turnovers per trajectory,
  two temperatures, eight maximally distant semantic seeds, three stochastic
  repetitions per cell.

generators: [or-qwen3-8b]
embeddings: [bge-m3, qwen3-embed-8b]

windows:
  - W: 4096
    block_size: 1024
    target_tokens: 131072 # 32 turnovers
    chunk_size: 1024
    protocol: P1_reprompt

sampling:
  - temperature: 0.3
    top_p: 1.0
  - temperature: 1.0
    top_p: 1.0

semantic_seeds:
  [physics, finance, biology, war, love, programming, surreal, noise]

stochastic_seeds: [1, 2, 3]

# Single endpoint (Alibaba), so there is no fallback if it throttles; keep the
# concurrency low and rely on resumability.
max_concurrent: 2
budget_usd: 9.0
