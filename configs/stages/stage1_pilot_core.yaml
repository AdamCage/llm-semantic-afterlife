# ===========================================================================
# S1 core arm — the wide matrix
# ---------------------------------------------------------------------------
# Generator and endpoint chosen by measurement, not by catalogue price
# (ADR-0007). `deepinfra/fp8` llama-3.1-8b-instruct was the only candidate that
# measured:
#
#   block fill 1.000, minimum 1.000   -> the stride really is S = B
#   stop rate  0.000                  -> no EOS interruptions
#   prompt-token delta 0              -> no server-side template added
#   reasoning tokens 0 (all switches) -> nothing hidden from the block
#   fp8, status 0, cheapest endpoint on either provider
#
# The first three of those remove methodology 0.1's variable-stride caveat for
# this arm, which is worth more than the 21x speedup Groq would have bought.
#
# Matrix rationale:
#   W = 8192, T = 262144   -> 32 turnovers, 256 chunk observations (ADR-0004)
#   2 temperatures         -> spans the expected confinement/diffusion contrast
#   8 semantic seeds       -> the seed-identity probe needs class diversity
#   3 stochastic seeds     -> minimum for a trajectory-level bootstrap
#
# Forecast ~$2.5 for 48 trajectories. Wall clock is the real cost: ~1.3 h per
# trajectory measured, so ~31 h at concurrency 2. Runs are resumable; re-invoking
# the same command continues from the last completed step.
# ===========================================================================

include:
  - configs/models/generators_openrouter.yaml
  - configs/embeddings/embeddings.yaml

stage: s1
name: pilot-core
description: >-
  Does the phenomenon exist? Wide arm on the cleanest measured endpoint:
  32 turnovers per trajectory, two temperatures, eight maximally distant
  semantic seeds, three stochastic repetitions per cell.

generators: [or-llama31-8b-deepinfra]
embeddings: [bge-m3, qwen3-embed-8b]

windows:
  - W: 8192
    block_size: 1024
    target_tokens: 262144 # 32 turnovers
    chunk_size: 1024
    protocol: P1_reprompt

sampling:
  - temperature: 0.3
    top_p: 1.0
  - temperature: 1.0
    top_p: 1.0

semantic_seeds:
  [physics, finance, biology, war, love, programming, surreal, noise]

stochastic_seeds: [1, 2, 3]

# This endpoint showed zero retries under sustained load, unlike every other
# candidate. Concurrency 2 rather than 4 keeps it that way; raise it only after
# S1 confirms the retry rate stays at zero.
max_concurrent: 2
budget_usd: 6.0
